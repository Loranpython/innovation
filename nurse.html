<!DOCTYPE html>
<!--
  nurse.html — the NURSE DASHBOARD (not linked from the patient screen).

  https://loranpython.github.io/innovation/nurse.html   (optional ?lang=nl|no|en)

  1. Press START SHIFT (browsers only allow sound + notifications after a click).
  2. Patient requests from every device appear live, oldest first.
  3. ACKNOWLEDGE  -> the patient sees "Your nurse has seen your request ✓"
     RESOLVED     -> the request disappears (it stays in "Resolved (last hour)").

  This page is markup only; the logic lives in js/nurse.js, styles in css/nurse.css.
  With an empty js/config.js it runs in LOCAL DEMO MODE (same browser only).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nurse station</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/nurse.css">
  <script type="module" src="./js/nurse.js"></script>
</head>
<body>
  <header class="app-header nurse-header">
    <span id="nurse-title"></span>
    <div class="nurse-indicators" id="nurse-indicators" hidden>
      <span class="nurse-connection" id="nurse-connection" role="status"></span>
      <span class="nurse-indicator" id="nurse-sound"></span>
      <span class="nurse-indicator" id="nurse-notify"></span>
    </div>
  </header>

  <main class="nurse">
    <section class="nurse-start" id="nurse-start">
      <h1 class="nurse-start-title" id="nurse-start-title"></h1>
      <p class="nurse-start-hint" id="nurse-start-hint"></p>
      <button type="button" class="big-button big-button--send nurse-start-button" id="nurse-start-button"></button>
    </section>

    <div class="nurse-dashboard" id="nurse-dashboard" hidden>
      <p class="nurse-error" id="nurse-error" role="alert" hidden></p>

      <section class="nurse-section nurse-section--open" aria-labelledby="nurse-open-heading">
        <h2 class="nurse-section-title" id="nurse-open-heading"></h2>
        <ol class="nurse-list" id="nurse-open-list"></ol>
      </section>

      <section class="nurse-section nurse-section--ack" aria-labelledby="nurse-ack-heading">
        <h2 class="nurse-section-title" id="nurse-ack-heading"></h2>
        <ol class="nurse-list" id="nurse-ack-list"></ol>
      </section>

      <details class="nurse-section nurse-resolved">
        <summary class="nurse-section-title" id="nurse-resolved-heading"></summary>
        <ol class="nurse-list" id="nurse-resolved-list"></ol>
      </details>
    </div>
  </main>
  <noscript>This page needs JavaScript to work.</noscript>
</body>
</html>
