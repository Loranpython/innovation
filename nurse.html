<!DOCTYPE html>
<!--
  nurse.html — DEBUG nurse view (not linked from the patient screen).

  Proves the notification pipeline works during the demo:
    - shows notifications already stored in localStorage ("pcs_notifications")
    - listens on BroadcastChannel("pcs_notifications") for new ones, live
    - newest on top: time · room · patient · type · readable details
    - "Clear" empties the list and localStorage

  Demo: open index.html in one tab/window and nurse.html in another tab of
  the SAME browser. Optional: nurse.html?lang=no for Norwegian.

  The real nurse dashboard will come later and use a real backend.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nurse view (debug)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/base.css">
  <style>
    .nurse { padding: var(--pad); display: flex; flex-direction: column; gap: var(--pad); }
    .nurse-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--pad); }
    .nurse-hint { color: var(--color-muted); }
    .nurse-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .nurse-item {
      display: grid;
      grid-template-columns: 6em 7em minmax(8em, 12em) 3em 1fr;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--color-surface);
      border: var(--border);
    }
    .nurse-item.is-new { border-width: 4px; }
    .nurse-time { font-variant-numeric: tabular-nums; }
    .nurse-room { font-weight: bold; }
    .nurse-icon { font-size: 32px; }
    .nurse-details { font-weight: bold; }
    .nurse-empty { color: var(--color-muted); padding: 12px 0; }
    .nurse-pain-spots { margin: 4px 0 0; padding-left: 0; list-style: none; font-weight: normal; }
    .nurse-pain-spots li { padding: 2px 6px; }
    .nurse-pain .is-high { background: var(--accent-pain); font-weight: bold; }
    @media (max-width: 700px) {
      .nurse-item { grid-template-columns: 1fr 1fr; }
      .nurse-details { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <header class="app-header"><span id="nurse-title"></span></header>
  <main class="nurse">
    <div class="nurse-bar">
      <p class="nurse-hint" id="nurse-hint"></p>
      <button type="button" class="big-button" id="nurse-clear"></button>
    </div>
    <ul class="nurse-list" id="nurse-list" aria-live="polite"></ul>
  </main>

  <script type="module">
    import { setLanguage, t, hasString } from "./js/strings.js";
    import {
      CHANNEL_NAME, readStoredNotifications, clearStoredNotifications,
    } from "./js/notifications.js";

    const params = new URLSearchParams(location.search);
    const lang = setLanguage(params.get("lang") || "en");
    document.documentElement.lang = lang === "no" ? "nb" : lang;
    document.title = t("nurse.title");

    const ICONS = { toilet: "🚻", drink: "💧", food: "🍽️", pain: "😣", speech: "🗣️" };

    const list = document.getElementById("nurse-list");
    const clearButton = document.getElementById("nurse-clear");
    document.getElementById("nurse-title").textContent = t("nurse.title");
    document.getElementById("nurse-hint").textContent = t("nurse.listening");
    clearButton.textContent = t("nurse.clear");
    clearButton.setAttribute("aria-label", t("nurse.clearAria"));

    /** Translate `key`, or return `fallback` if no translation exists. */
    function label(key, fallback) {
      return hasString(key) ? t(key) : fallback;
    }

    /**
     * Pain areas in the nurse's language, built from the points (one per
     * view + region). Left/right is already from the patient's perspective.
     * Limbs exist on both views, so they get "(front)"/"(back)"; hands and
     * central parts have their own back-view names (e.g. "Lower back").
     */
    function painAreas(d) {
      const seen = new Map();
      for (const { view, region } of d.points || []) seen.set(`${view}:${region}`, { view, region });
      if (seen.size === 0) return d.areas?.length ? d.areas.join(", ") : t("pain.noAreas");
      return [...seen.values()].map(({ view, region }) => {
        const name = label(`pain.region.${region}`, region);
        const isLimb = /^(left|right)_/.test(region) && !/hand$/.test(region);
        return isLimb ? `${name} (${t(view === "back" ? "nurse.viewBack" : "nurse.viewFront")})` : name;
      }).join(", ");
    }

    /**
     * Pain with spots: a header with the worst level and one line per spot,
     * highest level first. Levels of 7 or more are highlighted.
     *   Pain — worst 8/10
     *    1. Head (front) — 8/10 — sharp / stabbing
     *    2. Lower back (back) — 6/10 — dull ache → spreads to right thigh, right lower leg
     */
    function painSpots(d, type) {
      const lower = (text) => text.toLocaleLowerCase(lang === "no" ? "nb" : lang);
      const box = document.createElement("div");
      box.className = "nurse-pain";
      const head = document.createElement("div");
      head.className = "nurse-pain-head" + (d.maxLevel >= 7 ? " is-high" : "");
      head.textContent = `${type} — ${t("pain.nurseWorst", { n: d.maxLevel ?? "—" })}`;
      const ol = document.createElement("ol");
      ol.className = "nurse-pain-spots";
      const spots = [...d.spots].sort((a, b) => (b.level ?? -1) - (a.level ?? -1));
      for (const spot of spots) {
        const li = document.createElement("li");
        if (spot.level >= 7) li.className = "is-high";
        const view = t(spot.view === "back" ? "nurse.viewBack" : "nurse.viewFront");
        const name = label(`pain.region.${spot.region}`, spot.regionLabel);
        const level = document.createElement("strong");
        level.textContent = `${spot.level ?? "?"}/10`;
        const sensations = (spot.sensations || []).map((s) => lower(label(`pain.sensation.${s}`, s)));
        const spreads = (spot.radiatesTo || []).map((r) => lower(label(`pain.region.${r.region}`, r.regionLabel)));
        li.append(`${spot.number}. ${name} (${view}) — `, level,
          sensations.length ? ` — ${sensations.join(", ")}` : "",
          spreads.length ? ` → ${lower(t("pain.spreadsTo"))} ${spreads.join(", ")}` : "");
        ol.append(li);
      }
      box.append(head, ol);
      return box;
    }

    /** Human-readable details, e.g. "Pain 7/10 – Left knee, Lower back (front)". */
    function describe(n) {
      const d = n.details || {};
      const type = label(`type.${n.type}`, n.type);
      switch (n.type) {
        case "toilet":
          return type;
        case "drink":
          return `${type} – ${label(`drink.${d.item}`, d.item)}`;
        case "food":
          return `${type} – ${label(`food.${d.item}`, d.item)}`;
        case "pain": {
          if (Array.isArray(d.spots)) return painSpots(d, type);
          // Older format (one level for the whole body), e.g.
          // "Pain 7/10 · Right thigh (front), Lower back · Sharp / stabbing, Burning"
          const parts = [`${type} ${d.level ?? "—"}/10`, painAreas(d)];
          const sensations = (d.sensations || []).map((s) => label(`pain.sensation.${s}`, s));
          if (sensations.length) parts.push(sensations.join(", "));
          return parts.join(" · ");
        }
        case "speech":
          return `${type} – "${d.translatedText ?? ""}" (${d.originalLang ?? "?"}: "${d.originalText ?? ""}")`;
        default:
          return `${type} – ${JSON.stringify(d)}`;
      }
    }

    function itemElement(n, isNew) {
      const li = document.createElement("li");
      li.className = "nurse-item" + (isNew ? " is-new" : "");
      const cells = [
        ["nurse-time", new Date(n.timestamp).toLocaleTimeString()],
        ["nurse-room", t("nurse.room", { room: n.room })],
        ["nurse-patient", n.patient],
        ["nurse-icon icon", ICONS[n.type] || "🔔"],
        ["nurse-details", describe(n)],
      ];
      for (const [className, text] of cells) {
        const span = document.createElement("span");
        span.className = className;
        if (text instanceof Node) span.append(text);   // pain with spots (several lines)
        else span.textContent = text;
        li.append(span);
      }
      return li;
    }

    function showEmptyIfNeeded() {
      if (list.children.length === 0) {
        const li = document.createElement("li");
        li.className = "nurse-empty";
        li.textContent = t("nurse.empty");
        list.append(li);
      }
    }

    function add(n, isNew) {
      list.querySelector(".nurse-empty")?.remove();
      list.prepend(itemElement(n, isNew));   // newest on top
    }

    // Already stored notifications (oldest first -> prepend makes newest top)
    for (const n of readStoredNotifications()) add(n, false);
    showEmptyIfNeeded();

    // Live notifications from patient screens in this browser
    if ("BroadcastChannel" in window) {
      const channel = new BroadcastChannel(CHANNEL_NAME);
      channel.addEventListener("message", (event) => {
        console.log("[nurse] received", event.data);
        add(event.data, true);
      });
    }

    clearButton.addEventListener("click", () => {
      clearStoredNotifications();
      list.replaceChildren();
      showEmptyIfNeeded();
    });
  </script>
</body>
</html>
