<!DOCTYPE html>
<!--
  icons-preview.html — review page for the sensation pictograms.
  NOT linked from the app. Shows every icon at 40, 64 and 128 px with its
  label, plus the selected button look, so the group can judge them.

  Open via a local server: http://localhost:8000/modules/pain/icons-preview.html
  Other language: ...icons-preview.html?lang=nl
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sensation pictograms – preview</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="./pain.css">
  <style>
    .preview { padding: var(--pad); display: flex; flex-direction: column; gap: var(--pad); }
    .preview-table { border-collapse: collapse; background: var(--color-surface); }
    .preview-table th, .preview-table td { border: var(--border); padding: 12px 16px; text-align: center; vertical-align: middle; }
    .preview-table th { font-weight: bold; }
    .preview-table td:first-child { text-align: left; font-weight: bold; }
    .preview-table .sensation-icon { display: block; margin: auto; }
    .preview-buttons { display: grid; grid-template-columns: repeat(4, 140px); gap: 8px; }
    .preview-dark { background: var(--color-text); color: var(--color-surface); }
  </style>
</head>
<body>
  <header class="app-header"><span>Sensation pictograms – preview</span></header>
  <main class="preview">
    <table class="preview-table" id="table">
      <thead><tr><th>Sensation</th><th>40 px</th><th>64 px</th><th>128 px</th><th>40 px on dark</th></tr></thead>
      <tbody></tbody>
    </table>
    <h2 class="pain-heading">As buttons (2nd and 5th selected)</h2>
    <div class="preview-buttons pain-sensations-grid" id="buttons"></div>
  </main>

  <script type="module">
    import { SENSATIONS, radiatingIcon } from "./sensation-icons.js";
    import { setLanguage, t } from "../../js/strings.js";

    setLanguage(new URLSearchParams(location.search).get("lang") || "en");
    const sized = (html, px) => html.replace("<svg ", `<svg width="${px}" height="${px}" `);

    const tbody = document.querySelector("#table tbody");
    // The 8 sensations + the "Spreads to…" tool (radiating pain).
    const ALL = [...SENSATIONS, { id: "radiating", icon: radiatingIcon, labelKey: "pain.spreadsToButton" }];
    for (const { id, icon, labelKey } of ALL) {
      const row = document.createElement("tr");
      row.innerHTML = `<td>${t(labelKey ?? `pain.sensation.${id}`)}<br><small>${id}</small></td>` +
        [40, 64, 128].map((px) => `<td>${sized(icon(), px)}</td>`).join("") +
        `<td class="preview-dark">${sized(icon(), 40)}</td>`;
      tbody.append(row);
    }

    const buttons = document.getElementById("buttons");
    SENSATIONS.forEach(({ id, icon }, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "pain-sensation";
      button.setAttribute("aria-pressed", String(i === 1 || i === 4));
      button.innerHTML = icon() + `<span class="pain-sensation-label">${t(`pain.sensation.${id}`)}</span>` +
        `<span class="pain-sensation-check" aria-hidden="true"></span>`;
      buttons.append(button);
    });
  </script>
</body>
</html>
